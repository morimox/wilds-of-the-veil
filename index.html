* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-width: 280px; }
button, summary { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--jade); outline-offset: 3px; }
button:disabled { cursor: default; opacity: .55; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.35; }
h1 { font-size: 20px; }
h2 { font-size: 19px; }
h3 { font-size: 15px; }
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(200px, 235px);
  align-items: start;
  gap: 20px;
  width: min(830px, calc(100% - 32px));
  margin: 42px auto;
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.travel-column, .kit { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; }
.clock { margin-left: auto; color: var(--muted); font-size: 13px; }
.boot-status { max-width: 520px; padding: 24px; margin: 45px auto; }
.boot-status p { margin: 12px 0; color: var(--muted); }
.boot-status a { color: var(--jade); }
.top-button, .button, .navigation button {
  color: var(--text); border: 1px solid #405347; border-radius: 6px;
  background: #203027; padding: 6px 11px; min-height: 35px; cursor: pointer;
}
.top-button { min-height: 30px; min-width: 30px; padding: 2px 7px; background: transparent; color: var(--muted); }
.button:hover:not(:disabled), .top-button:hover, .navigation button:hover { background: #2c4033; border-color: #65826b; }
.button.primary { color: #142319; background: var(--jade); border-color: var(--jade); font-weight: 600; }
.button.primary:hover:not(:disabled) { background: #d2e7cb; }
.button.quiet, .navigation button { background: transparent; }
.button.danger { color: var(--red); }
.player-line, .actions, .navigation { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.navigation:has(button:not([hidden])) { margin-top: 13px; }
.player-line { min-height: 23px; padding: 10px 0 11px; color: var(--muted); font-size: 13px; }
.realm { color: var(--jade); font-weight: 600; }
.warning { color: var(--amber); }
.pressure { color: var(--muted); }
.pressure summary { cursor: pointer; }
.pressure > span { color: var(--muted); display: block; padding-top: 4px; }
.pressure.danger summary { color: var(--amber); }
.fog-marks { display: inline-flex; gap: 3px; vertical-align: middle; }
.fog-marks i { width: 7px; height: 7px; border-radius: 2px; border: 1px solid #657b6c; }
.fog-marks i.filled { background: #8eae97; }
.pressure.danger .fog-marks i { border-color: var(--amber); background: var(--amber); }
main { display: grid; gap: 11px; min-width: 0; border-top: 1px solid var(--line); padding-top: 13px; }
.panel { min-width: 0; }
.panel + .panel { border-top: 1px solid var(--line); margin-top: 3px; padding-top: 11px; }
.panel-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.actions { margin-top: 9px; }
.place-actions { margin-top: 0; }
.route-action { display: inline-flex; align-items: center; gap: 6px; }
.kit { padding-left: 17px; border-left: 1px solid var(--line); }
.kit-section + .kit-section { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }
.kit-section h2 { margin: 0 0 4px; font-size: 15px; }
.kit-head { display: flex; justify-content: space-between; align-items: baseline; gap: 5px; }
.bag-slots { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; margin: 4px 0 5px; }
.bag-slots i { height: 6px; border: 1px solid #64766a; border-radius: 2px; }
.bag-slots i.filled { border-color: #8eae97; background: #8eae97; }
.item-row {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: baseline;
  gap: 0 8px;
}
.item-row:not(:has(.slot-label)) { grid-template-columns: minmax(0, 1fr); }
.slot-label { color: var(--muted); font-size: 12px; }
.item-trigger {
  justify-self: start;
  min-height: 30px;
  min-width: 0;
  padding: 3px 2px;
  border: 0;
  border-radius: 3px;
  color: var(--text);
  background: transparent;
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.item-trigger:hover, .item-trigger:focus-visible, .item-trigger[aria-expanded="true"] { color: var(--jade); }
.item-tip {
  display: none;
  grid-column: 1 / -1;
  border: 1px solid #526b59;
  border-radius: 5px;
  padding: 6px 8px;
  background: #1c2b21;
  color: var(--text);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  overflow-wrap: anywhere;
  pointer-events: none;
}
.entry-anchor { position: relative; display: inline-block; max-width: 100%; }
.item-tools { display: flex; grid-column: 1 / -1; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
.item-tools .button { padding: 3px 8px; min-height: 30px; font-size: 13px; }
@media (hover: hover) {
  .item-trigger:hover + .item-tip { position: absolute; z-index: 3; display: block; inset: calc(100% - 1px) 0 auto; }
  .entry-anchor > .item-trigger:hover + .item-tip { right: auto; width: min(236px, 73vw); }
}
.item-trigger:focus-visible + .item-tip,
.item-trigger[aria-expanded="true"] + .item-tip {
  position: static;
  display: block;
  width: auto;
  margin: 0 0 3px;
}
.card-grid, .choice-list { display: grid; }
.card, .choice { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card .actions { margin-top: 7px; }
.choice { display: grid; justify-items: start; }
.choice-list { margin-top: 6px; }
.card p, .choice p { margin-top: 3px; }
.intro, .fine, .section-note, .card p, .choice p { color: var(--muted); }
.fine, .section-note, .card p, .choice p, .tag { font-size: 13px; }
.tag { color: var(--jade); }
.tag.off { color: var(--muted); }
.tag.warn, .metal { color: var(--amber); }
.intent { color: var(--amber); }
.notices {
  position: fixed;
  z-index: 20;
  left: max(12px, env(safe-area-inset-left), calc((100vw - 830px) / 2));
  bottom: max(12px, env(safe-area-inset-bottom));
  display: grid;
  gap: 6px;
  width: min(350px, calc(100% - 24px));
  pointer-events: none;
}
.toast {
  border: 1px solid #647d6b;
  border-left: 3px solid #a1c69c;
  border-radius: 5px;
  padding: 7px 10px;
  background: #18271dfa;
  color: var(--text);
  font-size: 13px;
  overflow-wrap: anywhere;
  animation: toast-in .16s ease-out both;
}
.toast p + p { margin-top: 2px; }
.warning-toast { border-left-color: var(--red); background: #322119fa; color: #f5d9ca; }
@keyframes toast-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.intent { margin: 8px 0; }
.training-note { margin-bottom: 8px; }
.learned-arts { margin-top: 9px; }
.meter { max-width: 210px; color: var(--muted); font-size: 13px; }
.meter-track { display: block; height: 5px; margin-top: 4px; background: #29372f; border-radius: 4px; overflow: hidden; }
.meter-track i { display: block; width: var(--fill); height: 100%; background: #d69978; }
.scene, .workshop-art { height: 85px; margin-bottom: 9px; border-radius: 5px; background-size: cover; background-position: center; }

.deduction { display: grid; gap: 9px; }
.deduction fieldset { margin: 0; padding: 8px; min-width: 0; border: 1px solid var(--line); border-radius: 5px; }
.deduction legend { padding: 0 5px; color: var(--jade); }
.deduction input { margin-top: 3px; accent-color: var(--jade); }
.evidence-option { display: flex; align-items: flex-start; gap: 7px; padding: 5px; cursor: pointer; }
.evidence-option:has(input:checked) { background: #283c2d; }
.evidence-option small { display: block; color: var(--muted); }
.deduction-cases { margin-bottom: 9px; }
dialog { width: min(414px, calc(100% - 26px)); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
dialog::backdrop { background: #08100bd1; }
dialog ol { padding-left: 22px; color: var(--muted); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; }
.dialog-head button, .text-danger { color: var(--red); background: transparent; border: 1px solid #654e44; border-radius: 5px; padding: 4px 8px; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 610px) {
  .layout { grid-template-columns: minmax(0, 1fr); width: calc(100% - 24px); margin: 12px; padding: 13px; gap: 14px; }
  .kit { padding: 12px 0 0; border-width: 1px 0 0; border-style: solid; border-color: var(--line); }
  .button, .navigation button, .item-trigger { min-height: 38px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

#opening.intro {
  --intro-duration: 5.2s;
  position: fixed;
  inset: 0;
  z-index: 1000;
  overflow: hidden;
  isolation: isolate;
  background: #0b120f;
  animation: intro-away var(--intro-duration) linear both;
}
.intro-village, .intro-marsh, .intro-fog, .intro-fog::before, .intro-fog::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.intro-village {
  background: var(--village-image) 64.3% 47.5% / cover;
  transform-origin: 64.3% 47.5%;
  animation: intro-village var(--intro-duration) ease-out both;
}
.intro-marsh {
  background: var(--marsh-image) 72% 55% / cover;
  transform-origin: 72% 55%;
  animation: intro-marsh var(--intro-duration) ease-out both;
}
.intro-light {
  position: absolute;
  left: 64.3%;
  top: 47.5%;
  width: clamp(80px, 12vmin, 180px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, #ffd89180, #f3a04830 29%, transparent 70%);
  mix-blend-mode: screen;
  pointer-events: none;
  animation: intro-light var(--intro-duration) ease both;
}
.intro-fog::before, .intro-fog::after {
  content: "";
  inset: -20% -75%;
  will-change: transform, opacity;
}
.intro-fog::before {
  background:
    radial-gradient(ellipse 34% 21% at 50% 59%, #a8b8b0ca 4%, transparent 98%),
    radial-gradient(ellipse 27% 11% at 42% 70%, #bac9c193, transparent 98%),
    radial-gradient(ellipse 28% 25% at 61% 48%, #b6c5bbaf, transparent 95%);
  animation: intro-fog-low var(--intro-duration) linear both;
}
.intro-fog::after {
  background:
    radial-gradient(ellipse 29% 39% at 54% 53%, #bdcfc5ee 10%, transparent 95%),
    radial-gradient(ellipse 25% 33% at 42% 61%, #9cafabdf, transparent 95%);
  animation: intro-fog-wipe var(--intro-duration) ease-in-out both;
}
#opening.intro::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, #070f0bf0 0%, transparent 21%, transparent 50%, #090f0cba 99%);
}
.intro-title {
  position: absolute;
  z-index: 1;
  left: clamp(24px, 10vw, 140px);
  bottom: max(clamp(35px, 14vh, 150px), env(safe-area-inset-bottom));
  margin: 0;
  color: #f1eee0;
  font: 600 clamp(30px, 6.5vw, 78px)/1.3 "Songti SC", "Noto Serif CJK SC", STSong, SimSun, serif;
  letter-spacing: .18em;
  text-shadow: 0 3px 22px #060e08;
  animation: intro-title var(--intro-duration) ease both;
}
.intro-skip {
  position: absolute;
  z-index: 2;
  top: max(16px, env(safe-area-inset-top));
  right: max(clamp(16px, 4vw, 54px), env(safe-area-inset-right));
  min-height: 44px;
  padding: 7px 15px;
  border: 1px solid #d6e1d3a3;
  border-radius: 6px;
  background: #0b120fe8;
  color: #f1eee0;
  cursor: pointer;
}
.intro-skip:hover { background: #243a2d; }
@keyframes intro-village {
  0% { opacity: .4; transform: scale(1.02); }
  10% { opacity: 1; }
  48% { opacity: 1; transform: scale(1.16); }
  63%, 100% { opacity: 0; transform: scale(1.2); }
}
@keyframes intro-marsh {
  0%, 42% { opacity: 0; transform: scale(1.14); }
  67% { opacity: 1; }
  100% { opacity: 1; transform: scale(1.02); }
}
@keyframes intro-light {
  0% { opacity: 0; }
  8%, 23% { opacity: .55; }
  16%, 35% { opacity: .92; }
  55%, 100% { opacity: 0; }
}
@keyframes intro-fog-low {
  0% { opacity: .54; transform: translate(-21%, 5%); }
  47% { opacity: .78; }
  100% { opacity: .21; transform: translate(20%, -6%); }
}
@keyframes intro-fog-wipe {
  0%, 24% { opacity: 0; transform: translate(-27%, 13%); }
  49% { opacity: 1; }
  78%, 100% { opacity: 0; transform: translate(26%, -9%); }
}
@keyframes intro-title {
  0%, 52% { opacity: 0; transform: translateY(12px); }
  68%, 100% { opacity: 1; transform: translateY(0); }
}
@keyframes intro-away {
  0%, 92% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #opening.intro, .intro-village, .intro-title { animation: none; }
  .intro-marsh, .intro-fog, .intro-light { display: none; }
}

</style>

function seedNumber(seed) {

  let result = 2166136261;

  for (const [id, count] of resourceEntries(resources)) {

    const current = inventory[id] ?? 0;
    const gear = records.gear[id];
    if (gear && current) continue;
    const desired = gear ? 1 : count;
    const occupies = occupiesBackpack(state, id);
    const used = Math.ceil(current / stackSize);
    const fits = occupies ? Math.min(desired, (available + used) * stackSize - current) : desired;
    if (fits) accepted[id] = fits;
    if (fits < desired) spilled[id] = desired - fits;
    if (occupies) available -= Math.ceil((current + fits) / stackSize) - used;
  }
  return { accepted, spilled };
}

    inventory: {},
    knownItems: [],
    reliefRations: 0,
    equipment: { weapon: null, armor: null, charm: null },
    durability: {},
    knownArts: [...(settings.arts ?? data.arts.filter((entry) => entry.tier === 0 && !entry.price)
      .slice(0, 1).map((entry) => entry.id))],
    completedQuests: [],
    completedDeductions: [],
    explored: [],
    discovered: [],
    eventsSeen: {},
    seenChoices: [],
    defeated: [],
    studies: {},
    event: null,
    combat: null,
    expeditionLoot: {},
    ground: {},
    groundDurability: {},
    won: false,
    wonDay: null,
    victoryPending: false,
    log: [],
  };
  addItems(state, settings.inventory ?? { ration: 4, wood: 2 });
  for (const id of Array.isArray(settings.gear) ? settings.gear : Object.values(settings.gear ?? {})) {
    if (records.gear[id]) {
      addItems(state, { [id]: 1 });
      state.equipment[records.gear[id].slot] = id;
    }
  }
  const { maxHp, maxQi } = stats(state);
  state.hp = maxHp;
  state.qi = maxQi;
  refreshDiscovery(state);
  return state;
}

function currentIntent(state) {
  const enemy = enemyOf(state);
  if (!enemy) return null;
  return enemy.intents[state.combat.round % enemy.intents.length];
}

function hasChoiceNeeds(state, choice) {
  return Object.keys(missingItems(state, choice.need)).length === 0;
}

function revisitableEvents(state) {
  if (atHome(state) || state.event || state.combat) return [];
  return (state.eventsSeen[state.region] ?? []).map((id) => records.events[id]).filter((event) =>
    event.revisit && event.choices.some((choice, index) =>
      choice.hidden && hasChoiceNeeds(state, choice) && !state.seenChoices.includes(`${event.id}:${index}`)));
}

function view(state) {
  const enemy = enemyOf(state);
  const intent = currentIntent(state);
  const mode = state.victoryPending ? 'victory' : state.combat ? 'combat' : state.event ? 'event' : atHome(state) ? 'village' : 'field';
  const nextRegion = data.regions.find(({ id, secret, hidden }) => !secret && !hidden && !state.discovered.includes(id));
  const services = data.services.filter(({ id }) => knowsService(state, id)).map(({ id }) => id);
  const discoveredQuests = services.includes('quests') ? data.quests.filter((quest) => knowsQuest(state, quest)) : [];
  const currentEvent = state.event ? records.events[state.event] : null;
  const visibleChoices = (currentEvent?.choices ?? []).map((choice, index) => {
    const lockedReason = choiceBlocker(state, choice);
    const { label, desc, hidden } = choice;
    return { label, desc, hidden, index, available: !lockedReason, lockedReason };
  }).filter(({ hidden, index }) => !hidden || hasChoiceNeeds(state, currentEvent.choices[index]));
  return {
    ...state,
    ...stats(state),
    mode,
    day: state.day,
    realmIndex: state.realm,
    realm: realmOf(state),
    nextRealm: services.includes('cultivate') ? records.realms[state.realm + 1] ?? null : null,
    regionId: state.region,
    region: regionOf(state),
    services,
    backpackUsed: backpackSlots(state),
    backpackCapacity: rules.backpackCapacity,
    groundLoot: { ...groundAt(state) },
    currentEvent: currentEvent ? { ...currentEvent, choices: visibleChoices } : null,
    visibleChoices,
    revisitableEvents: revisitableEvents(state).map(({ id, name }) => ({ id, name })),
    currentEnemy: enemy ? { ...enemy, maxHp: enemy.hp, hp: state.combat.hp } : null,
    intent,
    intentDamage: enemy && intent ? estimatedHit(enemy, intent) : 0,
    discoveryHint: state.explored.length ? nextRegion?.hint ?? '' : '',
    discoveredArts: data.arts.filter((art) => state.knownArts.includes(art.id) ||
      (services.includes('cultivate') && art.tier <= state.realm && isRevealed(state, art.reveal))).map(({ id }) => id),
    discoveredRecipes: services.includes('workshop') ? data.recipes.filter((recipe) => knowsRecipe(state, recipe)).map(({ id }) => id) : [],
    discoveredQuests: discoveredQuests.map(({ id }) => id),
    discoveredItems: data.items.filter((item) => knowsItem(state, item)).map(({ id }) => id),
    evidence: data.items.filter((item) => isEvidence(item) && owns(state, item.id) > 0)
      .map(({ id, name, desc }) => ({ id, name, desc, count: owns(state, id) })),
    deductions: (data.deductions ?? []).filter((entry) => knowsDeduction(state, entry)).map((entry) => {
      const { id, name, desc, hypotheses, days, success } = entry;
      const completed = (state.completedDeductions ?? []).includes(id);
      return { id, name, desc, hypotheses: hypotheses.map(({ id, label }) => ({ id, label })), days, completed, ...(completed ? { success } : {}) };
    }),
    quests: discoveredQuests.map((quest) => ({
      ...quest,
      completed: state.completedQuests.includes(quest.id),
      ready: Object.keys(missingItems(state, quest.need)).length === 0,
    })),
    lastMessage: state.log.at(-1) ?? '',
  };
}

function travel(state, id) {
  const destination = records.regions[id];
  if (!destination) return refuse('找不到这条路。');
  if (!state.discovered.includes(id)) return refuse('你还没有找到那条路。');
  if (state.region === id) return refuse('你已经在这里。');
  if (destination.tier > state.realm) return refuse(`前往${destination.name}需要${records.realms[destination.tier].name}。`);
  const route = id === hub ? regionOf(state) : destination;
  const food = route.food ?? 0;
  if (id !== hub && owns(state, supply) < food) return refuse(`上路至少需备${food}份${nameOf(supply)}。`);
  const shortage = Math.max(0, food - owns(state, supply));
  if (food > shortage) removeItem(state, supply, food - shortage);
  advance(state, (route.travel ?? 0) + rules.returnShortageDays * shortage);
  state.region = id;
  if (id === hub) {
    state.expeditionLoot = {};
    state.pressure = 0;
  }
  const delay = shortage ? '口粮不足，路上多歇了几次。' : '';
  return say(state, `抵达${destination.name}。${delay}`);
}

function explore(state) {
  const region = regionOf(state);
  if (atHome(state)) return refuse('先选一处去向。');
  const draws = region.draws.filter((entry) => entry.weight > 0);
  let selection = random(state) * draws.reduce((sum, entry) => sum + entry.weight, 0);
  const draw = draws.find((entry) => (selection -= entry.weight) < 0) ?? draws.at(-1);
  if (!draw || !records.events[draw.event]) return refuse('这一带眼下没有可查的动静。');
  return encounter(state, draw.event);
}

function revisit(state, id) {
  return revisitableEvents(state).some((event) => event.id === id)
    ? encounter(state, id)
    : refuse('眼下还找不到可回查的去处。');
}

function encounter(state, id) {
  const region = regionOf(state);
  advance(state, rules.exploreDays);
  state.pressure += rules.explorePressure;
  state.event = id;
  const known = state.eventsSeen[state.region] ?? [];
  if (!known.includes(id)) state.eventsSeen[state.region] = [...known, id];
  const first = !state.explored.includes(state.region);
  if (first) {
    state.explored.push(state.region);
    state.insight += rules.firstRegionInsight;
  }
  const burdened = state.pressure > rules.pressureThreshold && state.qi > 0;
  if (burdened) state.qi = Math.max(0, state.qi - rules.pressureQi);
  return say(state, `在${region.name}遇上${records.events[id].name}。${first ? `初探此地，见识+${rules.firstRegionInsight}。` : ''}${burdened ? `久探耗神，真气−${rules.pressureQi}。` : ''}`);
}

function startCombat(state, id) {
  const enemy = records.enemies[id];
  state.combat = { id, hp: enemy.hp, round: 0, escapeBonus: 0 };
}

function choiceBlocker(state, choice) {
  const food = Math.max(0, choice.food ?? 0);
  const coins = choice.coins ?? 0;
  const missing = missingItems(state, choice.need);
  if (Object.keys(missing).length) return `还缺${goodsText(missing)}。`;
  if (food + (choice.consume ? choice.need?.[supply] ?? 0 : 0) > owns(state, supply)) return `还需${food}份${nameOf(supply)}。`;
  if (state.coins + coins < 0) return `还需${-coins}枚灵钱。`;
  return '';
}

function choose(state, index) {
  const event = records.events[state.event];
  const choice = event.choices[index];
  if (!Number.isInteger(index) || !choice || (choice.hidden && !hasChoiceNeeds(state, choice))) {
    return refuse('请选择眼前能做的事。');
  }
  const blocker = choiceBlocker(state, choice);
  if (blocker) return refuse(blocker);
  const food = Math.max(0, choice.food ?? 0);
  const coins = choice.coins ?? 0;
  if (choice.consume) payItems(state, choice.need);
  if (food) removeItem(state, supply, food);
  state.event = null;
  advance(state, choice.days);
  state.coins += coins;
  const healthBefore = state.hp;
  state.hp += choice.hp ?? 0;
  state.qi += choice.qi ?? 0;
  normalize(state);
  const amount = Math.max(0, healthBefore - state.hp);
  const injury = amount ? { cause: choice.injury ?? '你在途中受了伤。', amount } : undefined;
  const choiceKey = `${event.id}:${index}`;
  const first = !state.seenChoices.includes(choiceKey);
  const insight = first ? (choice.insight ?? 0) : 0;
  if (first) {
    state.seenChoices.push(choiceKey);
    state.insight = Math.max(0, state.insight + insight);
  }
  const { accepted, spilled } = addItems(state, choice.loot, true);
  if (choice.enemy && records.enemies[choice.enemy]) startCombat(state, choice.enemy);
  const loot = goodsText(accepted);
  const detail = [choice.outcome, loot && `获得${loot}。`, insight > 0 && `见识+${insight}。`].filter(Boolean).join('');
  const result = say(state, detail || choice.label);
  return {
    ...(state.hp === 0 ? fall(state) : result),
    outcome: choice.outcome,
    injury,
    spilled,
  };
}

function fall(state) {
  const coinsLost = Math.min(rules.fallMaxCoinLoss, Math.ceil(state.coins * rules.fallCoinLossFactor));
  const lostGoods = Object.fromEntries(Object.entries(state.expeditionLoot).filter(([id]) =>
    records.items[id]?.kind !== 'key' && !records.items[id]?.keepOnFall));
  const dropped = goodsText(lostGoods);
  for (const [id, count] of Object.entries(lostGoods)) removeItem(state, id, Math.min(owns(state, id), count));
  state.expeditionLoot = {};
  state.coins -= coinsLost;
  state.region = hub;
  state.event = null;
  state.combat = null;
  state.pressure = 0;
  state.focus = 0;
  state.toxin = 0;
  state.wounds = Math.min(rules.maxWounds, state.wounds + rules.fallWounds);
  advance(state, rules.fallDays);
  state.hp = Math.ceil(stats(state).maxHp * rules.fallHpFactor);
  state.qi = Math.min(rules.fallQi, stats(state).maxQi);
  return say(state, `村人把你捎了回来。${coinsLost ? `药费${coinsLost}枚灵钱。` : ''}${dropped ? `路上遗落${dropped}。` : ''}可在村内歇息。`);
}

function finishCombat(state, enemy) {
  state.combat = null;
  const first = !state.defeated.includes(enemy.id);
  if (first) state.defeated.push(enemy.id);
  const insight = first ? (enemy.insight ?? 0) : 0;
  state.insight += insight;
  state.coins += enemy.coins ?? 0;
  const { accepted, spilled } = addItems(state, enemy.loot, true);
  const loot = goodsText(accepted);
  return {
    message: `击退${enemy.name}。${loot ? `获得${loot}。` : ''}${enemy.coins ? `灵钱+${enemy.coins}。` : ''}${insight ? `见识+${insight}。` : ''}`,
    spilled,
  };
}

function estimatedHit(enemy, intent) {
  if (intent.kind === 'guard' || intent.kind === 'heal') return 0;
  return Math.ceil(enemy.atk * (intent.mult ?? 1));
}

function crossRealmFactor(state, enemy) {
  return data.realms
    .filter(({ id }) => id > state.realm && id <= enemy.tier)
    .reduce((factor, realm) => factor * (realm.pressure ?? 1), 1);
}

function combatTraits(state, enemy, intent) {
  const effects = { damage: 0, pierce: 0, guard: 0 };
  for (const { trait } of activeGear(state)) {
    if (!trait || (trait.enemyTag && !enemy.tags?.includes(trait.enemyTag)) ||
        (trait.intent && trait.intent !== intent.kind)) continue;
    effects[trait.kind] += trait.bonus;
  }
  return effects;
}

function combatTurn(state, { damage = 0, pierce = 0, guard = 0, interrupt = 0, counter = 0, wearWeapon = false, message }) {
  const enemy = enemyOf(state);
  const intent = currentIntent(state);
  const { defense } = stats(state);
  const traits = combatTraits(state, enemy, intent);
  const weaponDamageBonus = wearWeapon ? traits.damage : 0;
  const weaponPierceBonus = wearWeapon ? traits.pierce : 0;
  const armor = intent.kind === 'guard'
    ? Math.max(enemy.def + rules.enemyGuardBonus, Math.ceil(enemy.def * (intent.mult ?? 1)))
    : enemy.def;
  const effectiveDamage = Math.floor((damage + weaponDamageBonus) * crossRealmFactor(state, enemy));
  const dealt = damage > 0 ? Math.max(rules.minAttackDamage, effectiveDamage - Math.max(0, armor - pierce - weaponPierceBonus)) : 0;
  const damageDealt = Math.min(state.combat.hp, dealt + counter);
  const healthBefore = state.hp;
  state.combat.hp -= dealt + counter;
  advance(state, rules.battleDays);
  const weaponDamage = wearWeapon ? wear(state, 'weapon') : '';
  let summary = `${message}${dealt + counter ? `造成${dealt + counter}点伤害。` : ''}${weaponDamage}`;
  if (state.combat.hp <= 0) {
    const outcome = finishCombat(state, enemy);
    normalize(state);
    return { ...say(state, summary + outcome.message), damageDealt, damageTaken: 0, spilled: outcome.spilled };
  }
  if (intent.kind === 'heal') {
    const before = state.combat.hp;
    state.combat.hp = Math.min(enemy.hp, before + Math.max(0, Math.ceil(enemy.atk * (intent.mult ?? 1)) - interrupt));
    summary += `${enemy.name}恢复了${state.combat.hp - before}点生命。`;
  } else if (intent.kind === 'guard') {
    summary += `${enemy.name}稳住了架势。`;
  } else {
    const received = Math.max(0, estimatedHit(enemy, intent) - defense - guard - traits.guard - interrupt);
    if (intent.kind === 'drain') {
      const lostQi = Math.min(state.qi, received);
      state.qi -= lostQi;
      state.hp -= received - lostQi;
      const armorDamage = received > lostQi ? wear(state, 'armor') : '';
      summary += `${enemy.name}抽走你${lostQi}点真气${received > lostQi ? `，另造成${received - lostQi}点伤害` : ''}。${armorDamage}`;
    } else {
      state.hp -= received;
      const armorDamage = received ? wear(state, 'armor') : '';
      summary += received ? `${enemy.name}反击，你受了${received}点伤。${armorDamage}` : '你挡下了这一招。';
    }
  }
  state.combat.round += 1;
  normalize(state);
  const damageTaken = Math.max(0, healthBefore - state.hp);
  say(state, summary);
  return { ...(state.hp === 0 ? fall(state) : { ok: true, message: summary }), damageDealt, damageTaken };
}

function retreat(state, bonus = 0, lead = '', guard = 0) {
  const enemy = enemyOf(state);
  const intent = currentIntent(state);
  const { defense, retreat: retreatBonus } = stats(state);
  const reduction = clamp(retreatBonus + state.combat.escapeBonus + bonus, 0, 1);
  const received = Math.max(0, Math.ceil(estimatedHit(enemy, intent) * rules.retreatDamageFactor * (1 - reduction))
    - defense - guard);
  advance(state, rules.retreatDays);
  const charmDamage = retreatBonus > 0 ? wear(state, 'charm') : '';
  const armorDamage = received ? wear(state, 'armor') : '';
  const healthBefore = state.hp;
  state.hp -= received;
  state.combat = null;
  normalize(state);
  const damageTaken = Math.max(0, healthBefore - state.hp);
  const summary = `${lead}你退出了与${enemy.name}的交手，仍在${regionOf(state).name}。${received ? `脱身时受了${received}点伤。` : ''}${charmDamage}${armorDamage}`;
  say(state, summary);
  return { ...(state.hp === 0 ? fall(state) : { ok: true, message: summary }), damageDealt: 0, damageTaken };
}

function cast(state, id) {
  const art = records.arts[id];
  if (!art || !state.knownArts.includes(id)) return refuse('你还没学会这门术。');
  if (art.tier > state.realm) return refuse('这门术需要更高境界。');
  const cost = art.cost ?? 0;
  if (state.qi < cost) return refuse('真气不足。');
  state.qi -= cost;
  const focus = state.focus >= 1 ? 1 : 0;
  state.focus -= focus;
  return combatTurn(state, {
    damage: stats(state).attack + (art.power ?? 0) + focus * rules.focusDamage,
    pierce: art.pierce,
    guard: art.guard,
    interrupt: currentIntent(state).kind === 'heavy' ? art.break : 0,
    wearWeapon: true,
    message: `你使出${art.name}。`,
  });
}

function eat(state, inCombat) {
  if (!owns(state, supply)) return refuse('没有可吃的口粮。');
  if (state.hp >= stats(state).maxHp) return refuse('眼下气血充足。');
  removeItem(state, supply, 1);
  const before = state.hp;
  state.hp += rules.mealHeal;
  normalize(state);
  const message = `你吃下${nameOf(supply)}，生命+${state.hp - before}。`;
  return inCombat ? combatTurn(state, { message }) : say(state, message);
}

function use(state, id, inCombat) {
  if (id === supply) return eat(state, inCombat);
  if (!owns(state, id)) return refuse('行囊里没有这件物品。');
  const pill = records.pills[id];
  const talisman = records.talismans[id];
  const entry = pill ?? talisman;
  if (!entry) return refuse('这件物品不能直接使用。');
  if (entry.tier > state.realm) return refuse('你目前承受不了这件物品的效力。');
  if (talisman && !inCombat) return refuse('遇敌时才可催动这道符。');
  removeItem(state, id, 1);
  if (pill) {
    state.hp += pill.hp ?? 0;
    state.qi += pill.qi ?? 0;
    state.toxin += pill.toxin ?? 0;
    state.wounds -= pill.wound ?? 0;
    state.focus += pill.focus ?? 0;
    const { spilled } = addItems(state, { [supply]: pill.food ?? 0 });
    normalize(state);
    const toxic = state.toxin >= rules.toxinThreshold;
    const toxinDamage = toxic ? Math.max(0, Math.min(state.hp - 1, rules.toxinDamage)) : 0;
    state.hp -= toxinDamage;
    const message = `你服下${nameOf(id)}。${toxinDamage ? `丹毒积重，损失${toxinDamage}点生命。` : ''}`;
    const result = inCombat ? combatTurn(state, { message }) : say(state, message);
    return {
      ...result,
      injury: toxinDamage ? { cause: '丹毒发作。', amount: toxinDamage } : undefined,
      spilled: combinedResources(spilled, result.spilled),
    };
  }
  const message = `你催动${nameOf(id)}。`;
  if (talisman.retreat > 0 && !talisman.damage) return retreat(state, talisman.retreat, message, talisman.guard);
  state.combat.escapeBonus += talisman.retreat ?? 0;
  return combatTurn(state, {
    damage: talisman.damage,
    pierce: Infinity,
    guard: talisman.guard,
    message,
  });
}

function equip(state, id) {
  const gear = records.gear[id];
  if (!gear || !owns(state, id)) return refuse('行囊里没有这件装备。');
  if (state.realm < gear.tier) return refuse('这件装备需要更高境界。');
  if (!state.durability[id]) return refuse('这件装备需要先修理。');
  if (state.equipment[gear.slot] === id) return refuse('你已经穿戴了这件装备。');
  state.equipment[gear.slot] = id;
  normalize(state);
  return say(state, `换上${nameOf(id)}。`);
}

function unequip(state, slot) {
  if (!slots.includes(slot) || !state.equipment[slot]) return refuse('这个位置没有装备。');
  if (backpackSlots(state) >= rules.backpackCapacity) return refuse('行囊已满，收不下这件装备。');
  const id = state.equipment[slot];
  state.equipment[slot] = null;
  normalize(state);
  return say(state, `收起${nameOf(id)}。`);
}

function discard(state, id, count = owns(state, id)) {
  if (!records.items[id] || !Number.isInteger(count) || count < 1 || count > owns(state, id)) return refuse('行囊里没有这件东西。');
  if (isEvidence(records.items[id])) return refuse('随身信物不能放到地上。');
  if (!occupiesBackpack(state, id)) return refuse('先把装备收下。');
  if (id === supply && owns(state, id) - state.reliefRations < count) return refuse('村里匀给你的口粮只供自用。');
  leaveOnGround(state, { [id]: count }, state.durability);
  removeItem(state, id, count, false);
  return say(state, `把${nameOf(id)}放到地上。`);
}

function takeFromGround(state, id, count = groundAt(state)[id]) {
  const ground = groundAt(state);
  if (!records.items[id] || !Number.isInteger(count) || count < 1 || count > (ground[id] ?? 0)) return refuse('这里没有这么多东西可捡。');
  const gear = records.gear[id];
  if (gear && owns(state, id)) return refuse('已经有同样的装备了。');
  const { accepted } = fittingItems(state, { [id]: count });
  const taken = accepted[id] ?? 0;
  if (!taken) return refuse('行囊已满。');
  ground[id] -= taken;
  if (!ground[id]) delete ground[id];
  addItems(state, accepted, true);
  if (gear) {
    const worn = state.groundDurability?.[state.region]?.[id];
    state.durability[id] = worn?.shift() ?? gear.durability;
  }
  return say(state, `拾起${goodsText(accepted)}。`);
}

function rest(state) {
  const needsRest = state.hp < stats(state).maxHp || state.qi < stats(state).maxQi || state.wounds || state.toxin || state.pressure;
  const relief = Math.max(0, rules.reliefRations - owns(state, supply));
  if (!needsRest && !relief) return refuse('你已经歇足了。');
  const granted = fittingItems(state, { [supply]: relief }).accepted[supply] ?? 0;
  if (relief && !granted && !needsRest) return refuse('行囊已满，拿不了干粮。');
  advance(state, rules.restDays);
  state.wounds -= rules.restWounds;
  state.toxin -= rules.restToxin;
  state.pressure = 0;
  state.hp += rules.restHp;
  state.qi += rules.restQi;
  normalize(state);
  if (granted) {
    state.reliefRations += granted;
    addItems(state, { [supply]: granted });
  }
  return say(state, `在村里歇了半日。${granted ? `灶上匀给你${granted}份${nameOf(supply)}。` : relief ? '行囊已满，拿不了干粮。' : ''}`);
}

function learn(state, id) {
  const art = records.arts[id];
  if (!art) return refuse('坊市没有这部术诀。');
  if (!isRevealed(state, art.reveal)) return refuse('你还没有这门术的传承线索。');
  if (state.knownArts.includes(id)) return refuse('你已经掌握了这门术。');
  if (art.tier > state.realm) return refuse('这门术需要更高境界。');
  const price = art.price ?? 0;
  if (state.coins < price) return refuse(`学这门术需要${price}枚灵钱。`);
  state.coins -= price;
  state.knownArts.push(id);
  return say(state, `学会${art.name}。`);
}

function research(state) {
  const sessions = state.studies[state.realm] ?? 0;
  if (sessions >= rules.researchLimit) return refuse('这一境的静修已经尽了功效，可到外面增进见识。');
  if (state.qi < rules.researchQi) return refuse('真气不足，先歇息片刻。');
  advance(state, rules.researchDays);
  state.qi -= rules.researchQi;
  state.studies[state.realm] = sessions + 1;
  state.insight += rules.researchInsight;
  return say(state, `静修半日，见识+${rules.researchInsight}。`);
}

function requirements(state, cost, need) {
  if (typeof cost === 'number' && state.coins < cost) return `需要${cost}枚灵钱。`;
  const missing = missingItems(state, need);
  if (Object.keys(missing).length) return `还缺${goodsText(missing)}。`;
  const costMissing = missingItems(state, cost);
  if (Object.keys(costMissing).length) return `还缺${goodsText(costMissing)}。`;
  for (const [id, count] of resourceEntries(cost)) {
    if (owns(state, id) < (need?.[id] ?? 0) + count) return `还缺${nameOf(id)}。`;
  }
  return '';
}

function pay(state, cost, need) {
  if (typeof cost === 'number') state.coins -= cost;
  else payItems(state, cost);
  payItems(state, need);
}

function hasRoom(state, loot, spent) {
  return !Object.keys(fittingItems(state, loot, spent).spilled).length;
}

function breakthrough(state) {
  const next = records.realms[state.realm + 1];
  if (!next) return refuse('你已经走到了此地传承的尽头。');
  if (state.insight < next.insight) return refuse(`突破需要${next.insight}点见识。`);
  const missing = requirements(state, next.cost, next.need);
  if (missing) return refuse(missing);
  pay(state, next.cost, next.need);
  advance(state, next.days);
  state.realm = next.id;
  const { maxHp, maxQi } = stats(state);
  state.hp = maxHp;
  state.qi = maxQi;
  return say(state, `你踏入${next.name}，气血与真气皆满。`);
}

function craft(state, id) {
  const recipe = records.recipes[id];
  if (!recipe) return refuse('没有这张配方。');
  if (recipe.tier > state.realm) return refuse('这一手做法需要更高境界。');
  if (!knowsRecipe(state, recipe)) return refuse('你还没找到这个做法。');
  if (records.gear[recipe.result] && owns(state, recipe.result)) return refuse('你已经有这件装备，可以在坊市修理。');
  const missing = requirements(state, recipe.cost, recipe.need);
  if (missing) return refuse(missing);
  const loot = { [recipe.result]: recipe.count ?? 1 };
  if (!hasRoom(state, loot, combinedResources(recipe.cost, recipe.need))) return refuse('行囊已满，放不下制成的东西。');
  pay(state, recipe.cost, recipe.need);
  advance(state, recipe.days);
  addItems(state, loot);
  return say(state, `制成${nameOf(recipe.result)}×${recipe.count ?? 1}。`);
}

function trade(state, id, count, buying) {
  const item = records.items[id];
  if (!item || !Number.isInteger(count) || count < 1 || count > rules.maxTradeCount) return refuse('请选择交易物品及数量。');
  if (!knowsItem(state, item)) return refuse('坊市还没有这件物品的消息。');
  const price = buying ? item.price : item.sell;
  if (!(price > 0)) return refuse('坊市没有这门买卖。');
  const gear = records.gear[id];
  if (buying) {
    const object = gear ?? records.pills[id] ?? records.talismans[id];
    if (object && object.tier > state.realm) return refuse('等境界到了再想这件物品。');
    if (gear && (owns(state, id) || count !== 1)) return refuse('同种装备只能持有一件。');
    if (state.coins < price * count) return refuse(`这批物品需要${price * count}枚灵钱。`);
    if (!hasRoom(state, { [id]: count })) return refuse('行囊已满。');
    state.coins -= price * count;
    addItems(state, { [id]: count });
  } else {
    if (owns(state, id) < count) return refuse('行囊里没有这么多。');
    if (gear && state.equipment[gear.slot] === id) return refuse('先把这件装备收下。');
    if (id === supply && owns(state, id) - state.reliefRations < count) return refuse('村里匀给你的口粮只供自用。');
    removeItem(state, id, count, false);
    state.coins += price * count;
  }
  return say(state, `${buying ? '买入' : '卖出'}${item.name}×${count}，${price * count}枚灵钱。`);
}

function repair(state, id) {
  const gear = records.gear[id];
  if (!gear || !owns(state, id)) return refuse('行囊里没有这件装备。');
  if (state.durability[id] >= gear.durability) return refuse('这件装备已经完好。');
  const cost = gear.repair ?? 1;
  const missing = requirements(state, cost);
  if (missing) return refuse(missing);
  pay(state, cost);
  state.durability[id] = gear.durability;
  return say(state, `修好${nameOf(id)}，耐久已满。`);
}

function handin(state, id) {
  const quest = records.quests[id];
  if (!quest || !knowsQuest(state, quest)) return refuse('找不到这份委托。');
  if (state.completedQuests.includes(id)) return refuse('这份委托已经交付。');
  const missing = missingItems(state, quest.need);
  if (Object.keys(missing).length) return refuse(`还缺${goodsText(missing)}。`);
  if (!hasRoom(state, quest.reward, quest.need)) return refuse('行囊已满，放不下回礼。');
  payItems(state, quest.need);
  addItems(state, quest.reward);
  state.coins += quest.coins ?? 0;
  state.insight += quest.insight ?? 0;
  state.completedQuests.push(id);
  const victory = id === victoryQuestId();
  if (victory) {
    state.won = true;
    state.wonDay = state.day;
    state.victoryPending = true;
  }
  const outcome = quest.outcome ?? (victory ? '村人接过镇渡印，旧渡重新开闸。' : undefined);
  return { ...say(state, outcome ?? `已交付${quest.name}。`), outcome };
}

function deduce(state, { id, evidence, hypothesis }) {
  const deduction = records.deductions[id];
  if (!deduction || !knowsDeduction(state, deduction)) return refuse('眼下没有这桩疑案的头绪。');
  if (state.completedDeductions?.includes(id)) return refuse('这桩疑案已经推明。');
  if (!deduction.hypotheses.some(({ id }) => id === hypothesis) || !Array.isArray(evidence)) {
    return refuse('请摆好证物，再选一个推断。');
  }
  const submitted = new Map();
  for (const itemId of evidence) {
    if (typeof itemId !== 'string' || !isEvidence(records.items[itemId])) return refuse('只能使用随身可查的证物。');
    const count = (submitted.get(itemId) ?? 0) + 1;
    if (count > owns(state, itemId)) return refuse('行囊里没有这么多证物。');
    submitted.set(itemId, count);
  }
  advance(state, deduction.days);
  const required = resourceEntries(deduction.evidence);
  const matches = submitted.size === required.length && required.every(([id, count]) => submitted.get(id) === count);
  if (!matches || hypothesis !== deduction.answer) {
    return { ...say(state, deduction.miss ?? '线索还连不起来，重新理一理证物和推断。'), deduction: 'miss' };
  }
  (state.completedDeductions ??= []).push(id);
  state.insight += deduction.insight ?? 0;
  const { spilled } = addItems(state, deduction.reward);
  const result = say(state, deduction.success);
  refreshDiscovery(state);
  return { ...result, deduction: 'solved', spilled };
}

const villageActions = {
  rest: (state) => rest(state),
  learn: (state, { id }) => learn(state, id),
  research: (state) => research(state),
  breakthrough: (state) => breakthrough(state),
  craft: (state, { id }) => craft(state, id),
  buy: (state, { id, count = 1 }) => trade(state, id, count, true),
  sell: (state, { id, count = 1 }) => trade(state, id, count, false),
  repair: (state, { id }) => repair(state, id),
  handin: (state, { id }) => handin(state, id),
};

const serviceForAction = {
  learn: 'cultivate', research: 'cultivate', breakthrough: 'cultivate',
  craft: 'workshop', repair: 'workshop', buy: 'market', sell: 'market', handin: 'quests',
};

const generalActions = {
  travel: (state, { id }) => travel(state, id),
  explore: (state) => explore(state),
  revisit: (state, { id }) => revisit(state, id),
  eat: (state) => eat(state, false),
  use: (state, { id }) => use(state, id, false),
  equip: (state, { id }) => equip(state, id),
  unequip: (state, { slot }) => unequip(state, slot),
  discard: (state, { id, count }) => discard(state, id, count),
  take: (state, { id, count }) => takeFromGround(state, id, count),
  deduce,
};

const combatActions = {
  attack: (state) => combatTurn(state, {
    damage: stats(state).attack,
    wearWeapon: true,
    message: '你抢先出手。',
  }),
  guard: (state) => combatTurn(state, {
    guard: rules.guardBonus,
    counter: currentIntent(state).kind === 'heavy' ? rules.guardCounter : 0,
    message: '你收身架守。',
  }),
  art: (state, { id }) => cast(state, id),
  use: (state, { id }) => use(state, id, true),
  eat: (state) => eat(state, true),
  retreat: (state) => retreat(state),
};

function takeTurn(state, action, payload) {
  if (state.victoryPending) {
    if (action !== 'resume') return refuse('收好这段游记，即可继续出门。');
    state.victoryPending = false;
    return say(state, '旧渡照常开船。你仍可留在村里，或再去寻路。');
  }
  if (state.combat) {
    if (Object.hasOwn(combatActions, action)) {
      const result = combatActions[action](state, payload);
      if (result.ok) refreshDiscovery(state);
      return result;
    }
    return refuse('先处理眼前的对手。');
  }
  if (state.event) {
    if (action === 'choose') {
      const result = choose(state, payload.index);
      if (result.ok) refreshDiscovery(state);
      return result;
    }
    if (action === 'leave') {
      state.event = null;
      return say(state, '你放下这桩事，沿原路退出。');
    }
    return refuse('先决定如何处理眼前的事。');
  }
  if (Object.hasOwn(villageActions, action)) {
    if (!atHome(state)) return refuse('这件事要回村办理。');
    const service = serviceForAction[action];
    if (service && !knowsService(state, service)) return refuse('你还没有找到这个门路。');
    const result = villageActions[action](state, payload);
    if (result.ok) refreshDiscovery(state);
    return result;
  }
  if (Object.hasOwn(generalActions, action)) return generalActions[action](state, payload);
  return refuse('眼下无法这样做。');
}

function act(state, action, payload = {}) {
  const unknownServices = data.services.filter(({ id }) => !knowsService(state, id));
  const result = takeTurn(state, action, payload);
  if (!result.ok) return result;
  const found = unknownServices.filter(({ id }) => knowsService(state, id)).map(({ name }) => name);
  if (!found.length) return result;
  const notice = `打听到了村里的${found.join('、')}。`;
  say(state, notice);
  return { ...result, message: result.message + notice };
}

return { act, createGame, rules, view };
})();



const itemRows = Object.fromEntries(data.items.map(item => [item.id, item]));
const slotNames = { weapon: "兵刃", armor: "护具", charm: "法器" };
const intentNames = { attack: "进攻", heavy: "蓄势", guard: "守势", heal: "疗伤", drain: "夺气" };
const kindNames = { material: "材料", food: "口粮", gear: "装备", pill: "丹药", talisman: "符箓", key: "线索" };
const serviceNames = { cultivate: "修行", workshop: "工坊", market: "坊市", quests: "委托" };
const app = document.querySelector("#app");
const main = document.querySelector("#main");
const guide = document.querySelector("#help");
const kit = document.querySelector("#kit");
const notices = document.querySelector("#notices");
const opening = document.querySelector("#opening");
let state = freshGame();
let screen = "journey";
let openingTimer;
let selectedItem = null;
let activeDeduction = null;
const deductionDrafts = new Map();

function dismissOpening() {
  if (opening.hidden) return;
  clearTimeout(openingTimer);
  opening.hidden = true;
  app.inert = false;
  main.querySelector("button")?.focus({ preventScroll: true });
}

function showOpening() {
  opening.hidden = false;
  app.inert = true;
  opening.querySelector("[data-skip-opening]").focus({ preventScroll: true });
  openingTimer = setTimeout(dismissOpening, matchMedia("(prefers-reduced-motion: reduce)").matches ? 1600 : 5200);
}

function freshGame() {
  return createGame(crypto.getRandomValues(new Uint32Array(1))[0] || 1);
}

function escape(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function linkButton(label, action, value = "", tone = "", disabled = false) {
  return `<button type="button" class="button ${tone}" data-action="${action}" data-value="${escape(value)}"${disabled ? " disabled" : ""}>${escape(label)}</button>`;
}

function tabButton(label, tab) {
  return `<button type="button" class="button quiet" data-tab="${tab}">${escape(label)}</button>`;
}

function panel(title, body, aside = "") {
  return `<section class="panel"><div class="panel-header"><h2>${escape(title)}</h2>${aside}</div>${body}</section>`;
}

function tag(text, tone = "") {
  return `<span class="tag ${tone}">${escape(text)}</span>`;
}

function card(title, desc, badge = "", actions = "", entry = "") {
  const name = entry ? `<span class="entry-anchor"><button class="item-trigger" type="button" data-entry aria-expanded="false">${escape(title)}</button><span class="item-tip" role="tooltip">${escape(publicText(entry))}</span></span>` : escape(title);
  return `<article class="card"><div class="card-head"><h3>${name}</h3>${badge}</div>${desc ? `<p>${escape(publicText(desc))}</p>` : ""}${actions ? `<div class="actions">${actions}</div>` : ""}</article>`;
}

function meter(label, current, total) {
  const value = Math.min(100, Math.max(0, 100 * current / (total || 1)));
  return `<div class="meter"><span>${label} · ${condition(current, total)}</span>
    <span class="meter-track" style="--fill:${value}%" aria-hidden="true"><i></i></span></div>`;
}

function supplies(entries) {
  return Object.keys(entries ?? {}).map(id => itemRows[id]?.name ?? id).join("、");
}

function condition(current, total) {
  if (current <= 0) return "耗尽";
  if (current / total < 0.3) return "危急";
  return current < total ? "有损" : "充足";
}

function publicText(text, damage = false) {
  return String(text ?? "")
    .replace(/×\s*\d+(?:\.\d+)?/g, "")
    .replace(/(?:见识|修为|灵钱)\s*[+−-]\s*\d+(?:\.\d+)?。?/g, "")
    .replace(/真气\s*[+−-]\s*\d+(?:\.\d+)?/g, "真气受损")
    .replace(/，\s*\d+(?:\.\d+)?枚灵钱/g, "")
    .replace(/\d+(?:\.\d+)?枚灵钱/g, "灵钱")
    .replace(/丹毒积重，损失\d+点生命/g, "丹毒发作")
    .replace(/恢复了\d+点生命/g, "恢复了些气血")
    .replace(/抽走你\d+点真气/g, "夺走了你的真气")
    .replace(/\d+(?:\.\d+)?点(?:生命|真气|见识)/g, match => match.replace(/^\d+(?:\.\d+)?点/, ""))
    .replace(/\d+(?:\.\d+)?份/g, "些")
    .replace(/\d+(?:\.\d+)?点伤(?:害)?/g, match => damage ? match : "伤害")
    .replace(/\d+(?:\.\d+)?(?!(?:[\d.]|点伤))/g, "");
}

function tierName(id) {
  return data.realms.find(row => row.id === id)?.name ?? "";
}

function hasSupply(s, needed) {
  return Object.entries(needed ?? {}).every(([id, count]) => (s.inventory[id] ?? 0) >= count);
}

function inVillage(s) {
  return s.mode === "village";
}

function stats(s) {
  const warnings = [];
  if (s.mode === "combat") {
    warnings.push(`气血${condition(s.hp, s.maxHp)}`, `真气${condition(s.qi, s.maxQi)}`);
  } else {
    if (s.hp / s.maxHp < 0.3) warnings.push("气血危急");
    else if (s.hp < s.maxHp || s.wounds) warnings.push("受伤");
    if (s.qi < s.maxQi / 3) warnings.push("真气将尽");
  }
  if ((s.inventory.ration ?? 0) < rules.reliefRations) warnings.push("口粮不足");
  if (s.toxin >= rules.toxinThreshold) warnings.push("丹毒发作");
  const danger = s.pressure > rules.pressureThreshold;
  const marks = Array.from({ length: rules.pressureThreshold }, (_, i) =>
    `<i class="${i < s.pressure ? "filled" : ""}"></i>`).join("");
  const fog = s.pressure ? `<details class="pressure${danger ? " danger" : ""}">
    <summary>${danger ? "雾压过重" : "雾压"} <span class="fog-marks" aria-hidden="true">${marks}</span></summary>
    <span>雾积满后，再探索会耗真气。回村就会散去。</span>
  </details>` : "";
  return `<div class="player-line"><span class="realm">${escape(s.realm.name)}</span>${warnings.map(text => `<span class="warning">${text}</span>`).join("")}${fog}</div>`;
}

function discovered(s, region) {
  const known = s.discovered;
  if (Array.isArray(known)) return known.includes(region.id) || region.id === s.region.id;
  if (known && typeof known === "object") return Boolean(known[region.id]) || region.id === s.region.id;
  return !region.reveal || region.id === s.region.id;
}

function routeAction(s, r, primary) {
  const homeward = r.id === "village";
  const locked = r.tier > s.realm.id;
  const route = homeward ? s.region : r;
  const shortfall = Math.max(0, route.food - (s.inventory.ration ?? 0));
  const note = locked ? `需${tierName(r.tier)}` : shortfall ? (homeward ? "缺粮回程会慢些" : "口粮不足") : "";
  return `<div class="route-action">${linkButton(homeward ? "回村" : `去${r.name}`, "travel", r.id, primary ? "primary" : "", locked || (!homeward && shortfall > 0))}${note ? `<span class="fine">${escape(note)}</span>` : ""}</div>`;
}

function journey(s) {
  if (s.mode === "event") return eventScreen(s);
  if (s.mode === "combat") return combatScreen(s);
  if (s.mode === "victory") return panel("潮印归灯", `<p class="intro">旧渡重新点起了灯。</p><div class="actions">${linkButton("继续行旅", "resume", "", "primary")}</div>`);
  const known = data.regions.filter(region => region.id !== s.region.id && discovered(s, region));
  const isHome = inVillage(s);
  const needRest = s.hp < s.maxHp || s.qi < s.maxQi || s.wounds || s.toxin || s.pressure || (s.inventory.ration ?? 0) < rules.reliefRations;
  return panel(s.region.name, `<div class="actions place-actions">
    ${isHome ? "" : linkButton("探索", "explore", "", "primary")}
    ${known.map((r, i) => routeAction(s, r, isHome && i === 0)).join("")}
    ${isHome && needRest ? linkButton("歇息", "rest") : ""}
    ${(s.revisitableEvents ?? []).map(e => linkButton(`回查${e.name}`, "revisit", e.id)).join("")}
  </div>`);
}

function eventScreen(s) {
  const event = s.currentEvent;
  const choices = s.visibleChoices.map(choice => {
    const details = [choice.desc, choice.lockedReason].map(text => publicText(text)).filter(Boolean).join(" ");
    return `<div class="choice">${linkButton(choice.label, "choose", choice.index, "", choice.available === false)}${details ? `<p>${escape(details)}</p>` : ""}</div>`;
  }).join("");
  return panel(event.name, `<div class="scene scene-${escape(s.region.id)}" aria-hidden="true"></div><p class="intro">${escape(publicText(event.text))}</p><div class="choice-list">${choices}</div><div class="actions">${linkButton("离开", "leave", "", "quiet")}</div>`, tag(s.region.name));
}

function pillSummary(row) {

}

function talismanSummary(row) {

}

function artSummary(row) {

function combatScreen(s) {

    ${arts.length ? `<div class="card-grid learned-arts">${arts.map(row => card(row.name, "", "", linkButton(s.qi < row.cost ? "真气不足" : "施展", "art", row.id, "", s.qi < row.cost), row.desc)).join("")}</div>` : ""}
    `, tag(tierName(enemy.tier), "warn"));
}

function gearCondition(remaining, total) {
  return !remaining ? "损坏" : remaining / total < 0.25 ? "将坏" : remaining < total ? "磨损" : "完好";
}

function gearDescription(item, gear, remaining) {

  return remaining === undefined ? description : `${description} 目前${gearCondition(remaining, gear.durability)}。`;
}

function itemSlot(item, location, description, actions = "", label = "") {
  const key = `${location}-${item.id}`;
  const open = selectedItem === key;
  return `<div class="item-row" data-item-row="${escape(key)}">
    ${label ? `<span class="slot-label">${escape(label)}</span>` : ""}
    <button type="button" class="item-trigger" data-item="${escape(key)}" aria-expanded="${open}" aria-describedby="tip-${escape(key)}">${escape(item.name)}</button>
    <span class="item-tip" id="tip-${escape(key)}" role="tooltip">${escape(publicText(description))}</span>
    ${actions ? `<div class="item-tools"${open ? "" : " hidden"}>${actions}</div>` : ""}
  </div>`;
}

function pack(s) {
  const canEquip = inVillage(s) || s.mode === "field";
  const canUse = canEquip || s.mode === "combat";
  const canRepair = inVillage(s) && s.services?.includes("workshop");
  const worn = Object.entries(s.equipment).filter(([, id]) => id).map(([slot, id]) => {
    const gear = data.gear.find(row => row.id === id);
    const remaining = s.durability[id] ?? gear.durability;
    return itemSlot(itemRows[id], "worn", gearDescription(itemRows[id], gear, remaining),
      (canEquip ? linkButton("卸下", "unequip", slot) : "") + (canRepair && remaining < gear.durability ? linkButton(s.coins < gear.repair ? "灵钱不足" : "修理", "repair", id, "quiet", s.coins < gear.repair) : ""),
      slotNames[slot]);
  });
  const carried = data.items.filter(row => s.inventory[row.id] && !Object.values(s.equipment).includes(row.id));
  const inventory = carried.filter(row => row.kind !== "key").map(row => {
    const gear = data.gear.find(g => g.id === row.id);
    const pill = data.pills.find(g => g.id === row.id);
    const seal = data.talismans.find(g => g.id === row.id);
    let actions = "";
    if (gear) {
      const remaining = s.durability[row.id] ?? gear.durability;
      actions = (canEquip ? linkButton("装备", "equip", row.id, "", gear.tier > s.realm.id || remaining <= 0) : "") +
        (canRepair && remaining < gear.durability ? linkButton(s.coins < gear.repair ? "灵钱不足" : "修理", "repair", row.id, "quiet", s.coins < gear.repair) : "");
    }
    if (pill && canUse) actions = linkButton("服用", "use", row.id, "", pill.tier > s.realm.id);
    if (seal && s.mode === "combat") actions = linkButton("用符", "use", row.id, "", seal.tier > s.realm.id);
    if (row.id === "ration" && canUse && s.hp < s.maxHp) actions = linkButton("吃口粮", "eat");
    if (canEquip) actions += linkButton("放下", "discard", row.id, "quiet");
    const description = gear ? gearDescription(row, gear, s.durability[row.id] ?? gear.durability) : pill ? pillSummary(pill) : seal ? talismanSummary(seal) : row.desc;
    return itemSlot(row, "held", description, actions);
  });
  const clues = carried.filter(row => row.kind === "key").map(row => itemSlot(row, "clue", row.desc));
  const ground = canEquip ? Object.keys(s.groundLoot ?? {}).map(id => {
    const item = itemRows[id];
    const gear = data.gear.find(row => row.id === id);
    return itemSlot(item, "ground", gear ? gearDescription(item, gear) : item.desc, linkButton("拾起", "take", id));
  }) : [];
  const meter = Array.from({ length: s.backpackCapacity }, (_, i) => `<i${i < s.backpackUsed ? ' class="filled"' : ""}></i>`).join("");
  const room = s.backpackUsed >= s.backpackCapacity ? "已满" : s.backpackUsed >= s.backpackCapacity - 2 ? "快满了" : "有空位";
  return `<section class="kit-section"><h2>装备</h2>${worn.join("") || '<p class="fine">空</p>'}</section>
    <section class="kit-section"><div class="kit-head"><h2>行囊</h2><span class="fine">${room}</span></div>
      <div class="bag-slots" role="img" aria-label="行囊容量${room}">${meter}</div>
      ${inventory.join("") || '<p class="fine">空</p>'}
    </section>
    ${clues.length ? `<section class="kit-section"><h2>线索</h2>${clues.join("")}</section>` : ""}
    ${ground.length ? `<section class="kit-section"><h2>脚边</h2>${ground.join("")}</section>` : ""}`;
}

function village(s) {
  return panel("村务", `<div class="actions place-actions">${(s.services ?? []).map(service => tabButton(serviceNames[service], service)).join("")}</div>`);
}

function cultivation(s) {
  const next = s.nextRealm;
  const missing = next ? [s.insight < next.insight && "根基尚未稳固", s.coins < next.cost && "灵钱不足", !hasSupply(s, next.need) && `还缺${supplies(next.need)}`].filter(Boolean) : [];
  const training = panel("修行", `<div class="actions place-actions">${linkButton("打坐", "research")}
    ${next ? linkButton("尝试突破", "breakthrough", "", "primary", missing.length > 0) : ""}</div>
    ${missing.length ? `<p class="fine">${escape(missing.join(" · "))}</p>` : ""}`);
  const visibleArts = data.arts.filter(row => s.discoveredArts.includes(row.id));
  return training + (visibleArts.length ? panel("术诀", `<div class="card-grid">${visibleArts.map(row => {
    const known = s.knownArts.includes(row.id);
    return card(row.name, "", known ? tag("已习得") : "",
      known ? "" : linkButton(s.coins < row.price ? "灵钱不足" : "习得", "learn", row.id, "", s.coins < row.price), `${artSummary(row)}。 ${row.desc}`);
  }).join("")}</div>`) : "");
}

function workshop(s) {
  const recipes = data.recipes.filter(row => s.discoveredRecipes.includes(row.id));
  return panel("工坊", `<div class="workshop-art" aria-hidden="true"></div><div class="card-grid">${recipes.map(row => {
    const result = itemRows[row.result];
    const gear = data.gear.find(g => g.id === row.result);
    const pill = data.pills.find(g => g.id === row.result);
    const talisman = data.talismans.find(g => g.id === row.result);
    const need = supplies(row.need);
    const reason = !hasSupply(s, row.need) ? "材料不足" : s.coins < row.cost ? "灵钱不足" : "";
    const entry = gear ? gearDescription(result, gear) : pill ? pillSummary(pill) : talisman ? talismanSummary(talisman) : result.desc;
    return card(result.name, need ? `需${need}` : "", tag(kindNames[result.kind] ?? ""), linkButton(reason || "制备", "craft", row.id, "", Boolean(reason)), entry);
  }).join("")}</div>`);
}

function market(s) {
  if (!inVillage(s)) return panel("坊市", '<p class="section-note">村里的摊主还在，回来再做打算。</p>');
  const currentTier = new Map([...data.gear, ...data.pills, ...data.talismans].map(row => [row.id, row.tier]));
  return panel("坊市", `<div class="card-grid">${data.items.filter(row => s.discoveredItems.includes(row.id) && ((row.price > 0 && (currentTier.get(row.id) ?? 0) <= s.realm.id) || (row.sell > 0 && s.inventory[row.id]))).map(row => {
    const equipped = Object.values(s.equipment).includes(row.id);
    const gear = data.gear.find(g => g.id === row.id);
    const options = [
      row.price > 0 && (currentTier.get(row.id) ?? 0) <= s.realm.id ? linkButton(row.price > s.coins ? "灵钱不足" : "购入", "buy", row.id, "", row.price > s.coins) : "",
      row.sell > 0 && s.inventory[row.id] ? linkButton("卖出", "sell", row.id, "quiet", equipped) : "",
    ].join("");
    const pill = data.pills.find(entry => entry.id === row.id);
    const seal = data.talismans.find(entry => entry.id === row.id);
    return card(row.name, "", s.inventory[row.id] ? tag("持有") : "", options, gear ? gearDescription(row, gear) : pill ? pillSummary(pill) : seal ? talismanSummary(seal) : row.desc);
  }).join("")}</div>`);
}

function questDone(s, row) {
  if (Array.isArray(s.completedQuests)) return s.completedQuests.includes(row.id);
  const status = Array.isArray(s.quests) ? s.quests.find(q => q.id === row.id) : s.quests?.[row.id];
  return status === true || Boolean(status?.done ?? status?.completed);
}

function visibleQuests(s) {
  return s.quests.filter(row => (row.tier ?? 0) <= s.realm.id);
}

function questBoard(s) {
  const list = visibleQuests(s);
  return panel("委托", `<div class="card-grid">${list.map(row => {
    const done = questDone(s, row);
    const unmet = !hasSupply(s, row.need);
    return card(row.name, `${row.desc} 交付 ${supplies(row.need)}。`,
      done ? tag("已交付", "off") : "",
      done ? "" : linkButton(unmet ? "材料不足" : "交付", "handin", row.id, "primary", unmet));
  }).join("")}</div>`);
}

function deductionBoard(s) {
  const cases = s.deductions ?? [];
  if (!cases.length) return panel("沙盘", '<p class="intro">旅途中值得推敲的疑点会收进这里。</p>');
  const current = cases.find(row => row.id === activeDeduction) ?? cases.find(row => !row.completed) ?? cases[0];
  const draft = deductionDrafts.get(current.id);
  const casesBar = cases.length > 1 ? `<div class="actions deduction-cases">${cases.map(row => `<button type="button" class="button ${row.id === current.id ? "primary" : ""}" data-case="${escape(row.id)}" aria-pressed="${row.id === current.id}">${escape(row.name)}${row.completed ? " ✓" : ""}</button>`).join("")}</div>` : "";
  const evidence = (s.evidence ?? []).map(item => `<label class="evidence-option"><input type="checkbox" name="evidence" value="${escape(item.id)}"${draft?.evidence.includes(item.id) ? " checked" : ""}>
    <span><strong>${escape(item.name)}</strong><small>${escape(publicText(item.desc))}</small></span></label>`).join("");
  const hypotheses = current.hypotheses.map(hypothesis => `<label class="evidence-option"><input type="radio" name="hypothesis" value="${escape(hypothesis.id)}" required${draft?.hypothesis === hypothesis.id ? " checked" : ""}>
    <span>${escape(publicText(hypothesis.label))}</span></label>`).join("");
  return panel("沙盘推演", casesBar + `<h3>${escape(current.name)}</h3><p class="intro training-note">${escape(publicText(current.desc))}</p>` +
    (current.completed ? `<p class="intent">${escape(publicText(current.success))}</p>` :
      `<form class="deduction" data-deduction="${escape(current.id)}">
        <fieldset><legend>选出支撑结论的证物</legend>${evidence || '<p class="intro">手头还没有证物。</p>'}</fieldset>
        <fieldset><legend>你的解释</legend>${hypotheses}</fieldset>
        <div class="actions"><button class="button primary" type="submit"${evidence ? "" : " disabled"}>落子推演</button></div>
      </form>`), tag(current.completed ? "已解" : "待推敲", current.completed ? "" : "warn"));
}

function render() {
  const s = view(state);
  const inEncounter = s.mode === "event" || s.mode === "combat" || s.mode === "victory";
  const showVillage = inVillage(s) && Boolean(s.services?.length);
  const available = {
    journey: true, village: showVillage, deduction: Boolean(s.deductions?.length),
  };
  for (const service of Object.keys(serviceNames)) available[service] = showVillage && s.services.includes(service);
  const tab = inEncounter || !available[screen] ? "journey" : screen;
  const content = { journey, village, cultivate: cultivation, workshop, market, quests: questBoard, deduction: deductionBoard };
  document.querySelector("#clock").textContent = s.day % 1 < 0.5 ? "白昼" : "夜里";
  document.querySelector("#player-status").innerHTML = stats(s);
  kit.innerHTML = pack(s);
  for (const button of document.querySelectorAll(".navigation button")) {
    button.hidden = inEncounter || button.dataset.tab === tab || !available[button.dataset.tab];
  }
  main.innerHTML = content[tab](s);
}

function selectItem(key) {
  selectedItem = selectedItem === key ? null : key;
  for (const trigger of kit.querySelectorAll("[data-item]")) {
    const open = trigger.dataset.item === selectedItem;
    trigger.setAttribute("aria-expanded", String(open));
    const tools = trigger.parentElement.querySelector(".item-tools");
    if (tools) tools.hidden = !open;
  }
}

function showNotice(lines, warning) {
  if (!lines.length) return;
  const toast = document.createElement("div");
  toast.className = warning ? "toast warning-toast" : "toast";
  for (const line of lines) {
    const text = document.createElement("p");
    text.textContent = line;
    toast.append(text);
  }
  notices.append(toast);
  while (notices.childElementCount > 3) notices.firstElementChild.remove();
  setTimeout(() => toast.remove(), 4400);
}

function feedback(before, after, result, action) {
  const lines = [];
  if (result.injury?.amount) {
    const cause = result.injury.cause.replace(/[。！]+$/, "");
    lines.push(`${cause}，气血减少 ${result.injury.amount} 点。`);
  }
  if (result.damageDealt || result.damageTaken) {
    lines.push([
      result.damageDealt && `造成 ${result.damageDealt} 点伤害。`,
      result.damageTaken && `受到 ${result.damageTaken} 点伤害。`,
    ].filter(Boolean).join(""));
  }
  const acquired = data.items.filter(item => (after.inventory[item.id] ?? 0) > (before.inventory[item.id] ?? 0));
  const goods = acquired.filter(item => item.kind !== "key");
  const clues = acquired.filter(item => item.kind === "key");
  let narrative = result.message ?? "";
  if (result.damageDealt || result.damageTaken) {
    narrative = narrative.replace(/(?:造成|你受了|脱身时受了|另造成)\d+点伤(?:害)?。?/g, "").replace(/反击，[。]?/g, "反击。");
  }
  if (acquired.length) narrative = narrative.replace(/获得[^。]+。/g, "");
  if (result.injury) narrative = narrative.replace(result.injury.cause, "").replace(/丹毒积重，损失\d+点生命。?/g, "");
  if (result.ok && (action === "travel" || action === "explore" || action === "revisit")) {
    narrative = narrative.replace(/^(?:抵达[^。]+|在[^。]+遇上[^。]+)。/, "");
  }
  narrative = publicText(narrative).replace(/^初探此地[，。]?/, "").trim();
  if (narrative) lines.push(narrative);
  if (goods.length) lines.push(`获得${goods.map(item => item.name).join("、")}。`);
  if (clues.length) lines.push(`得到线索「${clues.map(item => item.name).join("、")}」。`);
  const didRecover = ["choose", "eat", "use", "rest"].includes(action) && after.hp > before.hp && !result.injury;
  const changes = [
    didRecover && !narrative.includes("气血") && "气血恢复",
    after.qi > before.qi && ["choose", "use", "rest"].includes(action) && !narrative.includes("真气") && "真气恢复",
    after.qi < before.qi && ["choose", "explore", "revisit", "art"].includes(action) && !narrative.includes("真气") && "消耗了真气",
    (after.inventory.ration ?? 0) < (before.inventory.ration ?? 0) && ["travel", "choose"].includes(action) && "用了些口粮",
    after.coins > before.coins && !["sell"].includes(action) && "获得灵钱",
  ].filter(Boolean);
  if (changes.length) lines.push(changes.join("，") + "。");
  const overflow = Object.keys(result.spilled ?? {}).map(id => itemRows[id].name);
  if (overflow.length) lines.push(`行囊装不下，${overflow.join("、")}留在脚边。`);
  for (const id of after.discovered) {
    if (!before.discovered.includes(id)) lines.push(`找到去${data.regions.find(region => region.id === id).name}的路。`);
  }
  return lines;
}

function performAction(action, payload) {
  const before = { inventory: { ...state.inventory }, discovered: [...state.discovered], hp: state.hp, qi: state.qi, coins: state.coins };
  const result = act(state, action, payload);
  if (["travel", "explore", "choose", "leave", "revisit", "resume"].includes(action)) screen = "journey";
  if (action === "travel" || action === "discard" || action === "take" || action === "equip" || action === "unequip") selectedItem = null;
  render();
  showNotice(feedback(before, state, result, action), Boolean(result.injury || result.damageTaken || !result.ok));
  if (["travel", "explore", "choose", "revisit"].includes(action)) main.scrollIntoView({ block: "nearest" });
}

document.addEventListener("submit", event => {
  const form = event.target;
  if (!form.matches("[data-deduction]")) return;
  event.preventDefault();
  const selected = new FormData(form);
  activeDeduction = form.dataset.deduction;
  const guess = { id: activeDeduction, evidence: selected.getAll("evidence"), hypothesis: selected.get("hypothesis") };
  deductionDrafts.set(activeDeduction, guess);
  performAction("deduce", guess);
});

document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.hasAttribute("data-skip-opening")) {
    dismissOpening();
    return;
  }
  if (button.dataset.item) {
    selectItem(button.dataset.item);
    return;
  }
  if (button.hasAttribute("data-entry")) {
    button.setAttribute("aria-expanded", String(button.getAttribute("aria-expanded") !== "true"));
    return;
  }
  if (button.hasAttribute("data-help")) {
    guide.showModal();
    return;
  }
  if (button.hasAttribute("data-close")) {
    guide.close();
    return;
  }
  if (button.hasAttribute("data-reset")) {
    if (!window.confirm("重新开始这一局？")) return;
    state = freshGame();
    screen = "journey";
    selectedItem = null;
    activeDeduction = null;
    deductionDrafts.clear();
    notices.replaceChildren();
    guide.close();
    render();
    showOpening();
    return;
  }
  if (button.dataset.tab) {
    screen = button.dataset.tab;
    render();
    return;
  }
  if (button.dataset.case) {
    activeDeduction = button.dataset.case;
    render();
    return;
  }
  const action = button.dataset.action;
  if (!action) return;
  const value = button.dataset.value;
  const payload = action === "choose" ? { index: Number(value) } :
    action === "unequip" ? { slot: value } : { id: value };
  performAction(action, payload);
});

render();
document.querySelector("#boot-status").hidden = true;
app.hidden = false;
showOpening();

})();
</script>
</body>
</html>
